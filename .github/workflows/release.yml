name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pack plugin tarballs
        run: ./scripts/pack.sh
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.tgz
          generate_release_notes: true